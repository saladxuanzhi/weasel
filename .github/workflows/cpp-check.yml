name: C++ check

# 快速验证 x64 和 x86 C++ 编译。
# 日志保存在 Actions 摘要和附件中，不写回源码分支。

on:
  workflow_dispatch:
  push:
    paths:
      - 'RimeWithWeasel/**'
      - 'WeaselIPC/**'
      - 'WeaselIPCServer/**'
      - 'WeaselServer/**'
      - 'WeaselUI/**'
      - 'WeaselTSF/**'
      - 'WeaselDeployer/**'
      - 'include/**'
      - 'xmake.lua'
      - '**/xmake.lua'
      - '.github/workflows/cpp-check.yml'

permissions:
  contents: read

env:
  boost_version: 1.84.0
  BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
  SDKVER: 10.0.19041.0

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure build environment
        shell: bash
        run: cp env.vs2022.bat env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Get Rime files
        shell: pwsh
        run: .\get-rime.ps1 -use dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build x64 and x86
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          # weasel.dll 是 x86 产物、weaselx64.dll 是 x64，两个都要能编出来
          '' | Out-File -Encoding utf8 build.log
          foreach ($arch in @('x64', 'x86')) {
            "== xmake f -a $arch ==" | Out-File -Encoding utf8 -Append build.log
            xmake f -a $arch -m release --vs_sdkver=$env:SDKVER -c 2>&1 |
              Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) {
              "!! xmake f -a $arch 失败" | Out-File -Encoding utf8 -Append build.log
              exit $LASTEXITCODE
            }
            "== xmake ($arch) ==" | Out-File -Encoding utf8 -Append build.log
            xmake 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) {
              "!! xmake ($arch) 失败" | Out-File -Encoding utf8 -Append build.log
              exit $LASTEXITCODE
            }
          }
          Get-ChildItem output\weasel*.dll | Format-Table Name, Length |
            Out-File -Encoding utf8 -Append build.log

      - name: Publish log
        if: always()
        shell: pwsh
        run: |
          $report = "cpp-build-report.md"
          $lines = @()
          $lines += "# x64 + x86 编译日志"
          $lines += ""
          $lines += "由 ``.github/workflows/cpp-check.yml`` 生成，sha ``$env:GITHUB_SHA``。"
          $lines += ""
          $lines += "- build: ``${{ steps.build.outcome }}``"
          $lines += ""

          $log = if (Test-Path build.log) { Get-Content build.log } else { @() }
          $errs = $log | Select-String -Pattern 'error|error C|fatal error|错误' -CaseSensitive:$false
          $lines += "## 错误行（前 120 条，共 $($errs.Count) 条）"
          $lines += ""
          $lines += '```'
          if ($errs.Count -eq 0) {
            $lines += '(日志里没有匹配到 error)'
          } else {
            $lines += ($errs | Select-Object -First 120 | ForEach-Object { $_.Line })
          }
          $lines += '```'
          $lines += ""
          $lines += "## 日志尾部（200 行）"
          $lines += ""
          $lines += '```'
          $lines += ($log | Select-Object -Last 200)
          $lines += '```'
          $lines -join "`n" | Out-File -Encoding utf8 $report

          Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-diagnostics
          path: |
            cpp-build-report.md
            build.log
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Build failed; see the Actions summary and cpp-build-diagnostics artifact"
          exit 1
