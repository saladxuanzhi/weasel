[package]
name = "weasel-p2c"
version = "0.1.0"
edition = "2021"
description = "小狼毫的含章·通变 P2C 本地整句生成组件"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "weasel_p2c"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "p2c-check"
path = "src/bin/p2c-check.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"
zerocopy = { version = "0.8", features = ["derive"] }

[features]
default = []
# 保留青简代码里的 metal 分支（Windows 用不到），只是让 cfg 认得这个名字
metal = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
